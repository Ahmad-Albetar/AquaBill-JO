    /* config.js — ملف البيانات والإعدادات المركزي */
    const APP_CONFIG = {
      version: "1.0.0",
      storageKeys: {
        settings: "aquabill_settings"
      },
      // جدول التعرفة الرسمية الصادر عن الموارد المائية في الأردن
      // يشمل المياه، الصرف الصحي، و المقطوعية

        { min: 0,  max: 6,   waterRate: 0.15, sewageRate: 0.05, flatFee: 2.50 },
        { min: 7,  max: 12,  waterRate: 0.25, sewageRate: 0.08, flatFee: 2.50 },
        { min: 13, max: 18,  waterRate: 0.45, sewageRate: 0.15, flatFee: 2.50 },
        { min: 19, max: 24,  waterRate: 0.75, sewageRate: 0.25, flatFee: 2.50 },
        { min: 25, max: 30,  waterRate: 1.10, sewageRate: 0.40, flatFee: 2.50 },
        { min: 31, max: 40,  waterRate: 1.60, sewageRate: 0.65, flatFee: 2.50 },
        { min: 41, max: Infinity, waterRate: 2.20, sewageRate: 0.95, flatFee: 2.50 }
      ],
      defaultFlatFee: 2.50
    };
  </script>

  <!-- ===================== تطبيق الثيم الأولي لمنع الوميض ===================== -->
  <script>
    (function () {
      try {
        const raw = localStorage.getItem(APP_CONFIG.storageKeys.settings);
        const settings = raw ? JSON.parse(raw) : null;
        if (settings && (settings.theme === 'dark' || settings.theme === 'light')) {
          document.documentElement.setAttribute('data-theme', settings.theme);
        }
      } catch (e) { /* يُتجاهل بصمت */ }
    })();
  </script>

  <!-- ===================== ملف الأنماط (style) ===================== -->
  <style>
    /* style.css — التنسيقات الأساسية والمتغيرة */

    :root {
      --bg-color: #F2F6F5;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --primary: #0B4F45;
      --primary-accent: #0883FE;
      --border-color: #E2E8F0;
      --accent-gold: #D4A93B;
      --warning-bg: #FFFBEB;
      --warning-text: #92400E;
      --warning-border: #FBBF24;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      --font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }

    [data-theme="dark"] {
      --bg-color: #1A202C;
      --card-bg: #2D3748;
      --text-main: #F7FAFC;
      --text-muted: #A0AEC0;
      --primary: #2C7A7B;
      --primary-accent: #3182CE;
      --border-color: #4A5568;
      --warning-bg: rgba(146, 64, 14, 0.2);
      --warning-text: #FBBF24;
      --warning-border: #F59E0B;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-color: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      direction: rtl;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .skip-link {
      position: absolute;
      top: -40px;
      right: 0;
      background: var(--primary);
      color: white;
      padding: 8px;
      z-index: 100;
      transition: top 0.3s;
    }
    .skip-link:focus { top: 0; }

    .scroll-progress {
      position: fixed;
      top: 0;
      right: 0;
      height: 4px;
      background: var(--primary-accent);
      width: 0%;
      z-index: 1000;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 15px;
    }

    header {
      text-align: center;
      position: relative;
      padding: 20px 0 30px;
    }

    .brandrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logomark {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      background-color: #ffffff !important;
      border-radius: 50%;
    }

    .brandtext h1 {
      font-size: 1.6rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .jo-badge {
      background: #CE1126;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .eyebrow, .brand-tagline-ar {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .flagchip {
      vertical-align: middle;
    }

    .btn-theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s;
    }
    .btn-theme-toggle:hover {
      background-color: rgba(0,0,0,0.05);
    }

    .hero-badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .badge-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--primary);
      background: rgba(11, 79, 69, 0.08);
      padding: 5px 10px;
      border-radius: 100px;
    }
    .badge-pill svg {
      width: 14px;
      height: 14px;
    }

    .wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 30px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .card h2 .icn {
      width: 24px;
      height: 24px;
    }
    .titlewrap {
      display: flex;
      flex-direction: column;
    }
    .eyebrow2 {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    table.tariff {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    table.tariff th, table.tariff td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: center;
    }

    table.tariff th {
      background-color: rgba(0,0,0,0.03);
      font-weight: 700;
    }

    .input-field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.95rem;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(8, 131, 254, 0.1);
    }

    .alert-warning {
      background-color: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .result {
      background: rgba(8, 131, 254, 0.05);
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
    }

    .result .line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .res-item.total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
      color: var(--primary);
    }

    .flat-tag {
      font-size: 0.7rem;
      opacity: 0.8;
      font-weight: 400;
    }

    .box-marginal {
      background: rgba(0,0,0,0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .tanker-inputs-group {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 15px 0;
    }

    .compare .box {
      background-color: rgba(0,0,0,0.015);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .compare .lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .compare .val {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .tips-list {
      padding-right: 20px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .tips-list li {
      margin-bottom: 10px;
    }

    .tips-list strong {
      color: var(--text-main);
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
    }

    .footer-logo {
      margin-bottom: 10px;
    }

    .social-share-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 15px 0;
    }

    .social-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .social-btn:hover {
      transform: translateY(-2px);
    }

    .social-btn.whatsapp { background-color: #25D366; }
    .social-btn.facebook { background-color: #1877F2; }
    .social-btn.instagram { background-color: #E4405F; }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    .app-version {
      font-size: 0.75rem;
      margin-top: 10px;
    }

    .pwa-toast {
      position: fixed;
      bottom: -120px;
      left: 15px;
      right: 15px;
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 15px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 999;
      font-size: 0.95rem;
    }

    .pwa-toast.show {
      bottom: 20px;
    }

    .pwa-toast-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .pwa-toast-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: 0.9rem;
    }

    .pwa-toast-actions button.btn-install {
      background: var(--primary);
      color: white;
    }
    .pwa-toast-actions button.btn-later {
      background: rgba(0,0,0,0.05);
      color: var(--text-main);
    }

    /* أنيميشن */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @media (max-width: 480px) {
      .brandrow { flex-direction: column; text-align: center; gap: 8px; }
      .compare { grid-template-columns: 1fr; }
      .tanker-inputs-group { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
